<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, user-scalable=no">
  <title>Mosaico TV</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <video id="video" playsinline></video>

  <div id="app">
    <header id="top">
      <div class="brand">Mosaico TV</div>
      <nav id="nav">
        <button class="navbtn active" data-v="home">Inicio</button>
        <button class="navbtn" data-v="search">Buscar</button>
        <button class="navbtn" data-v="favs">Favoritos</button>
        <button class="navbtn" data-v="settings">Ajustes</button>
      </nav>
      <div id="searchbar"><input id="q" type="text" placeholder="Escribe un canal o categoría" autocomplete="off"></div>
    </header>

    <section id="hero">
      <div class="hero-text">
        <p id="heroGroup"></p>
        <h1 id="heroName"></h1>
        <p id="heroHint">OK para ver &nbsp;·&nbsp; Mantén OK para favorito</p>
      </div>
      <div id="heroArt"></div>
    </section>

    <section id="rowsViewport">
      <div id="rows"></div>
      <div id="empty"></div>
    </section>
  </div>

  <div id="player">
    <div id="spin"></div>
    <div id="pinfo">
      <div id="pnum"></div>
      <div class="ptext">
        <div id="pname"></div>
        <div id="pmeta"></div>
      </div>
      <div id="phint">▲ ▼ cambiar canal &nbsp;·&nbsp; Mantén OK favorito &nbsp;·&nbsp; Atrás salir</div>
    </div>
    <div id="perr">No se pudo reproducir este canal</div>
  </div>

  <div id="settings">
    <div class="panel">
      <h2>Ajustes</h2>
      <label for="setUrl">Dirección de tu lista M3U</label>
      <input id="setUrl" type="text" placeholder="http://..." autocomplete="off">
      <div class="btns">
        <button id="btnLoad">Cargar lista</button>
        <button id="btnDemo">Usar lista de prueba</button>
        <button id="btnClear">Borrar favoritos y recientes</button>
        <button id="btnClose">Cerrar</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="js/hls.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
